name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS backend: src/ (Metal). Guest code runs natively, so the host must be x86_64.
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      # std::jthread / std::stop_token need a recent libc++ (the runner's default
      # Xcode may be older than the one we build with).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Dependencies
        run: brew install cmake ninja sdl3
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build && cmake --build build --target gcn_dis

  # Windows backend: windows/ (DCport launcher and prepare tool).
  windows-launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install pillow pytest
      - name: Tests
        run: python -m pytest

  # Linux backend: runtime-linux/ (Native Vulkan renderer + HLE runtime).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libvulkan-dev libfreetype-dev libboost-dev glslang-tools \
            libx11-dev libxxhash-dev
          git clone --depth 1 https://github.com/libsdl-org/SDL.git -b release-3.4.18 /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX=/usr
          sudo cmake --build /tmp/sdl3/build --target install
          sudo ldconfig
      - name: Build & Test Linux Runtime
        run: |
          cd runtime-linux
          bash build.sh --test

